models:
  small:
    id: mock-small
    tier: small
    backend: mock
    replicas: 2
    max_concurrency: 8
    context_window: 8192
    input_cost_per_1m: 0.05
    output_cost_per_1m: 0.10
    quality_weight: 0.6
  large:
    id: mock-large
    tier: large
    backend: mock
    replicas: 1
    max_concurrency: 4
    context_window: 16384
    input_cost_per_1m: 0.25
    output_cost_per_1m: 0.50
    quality_weight: 1.0

routing:
  difficulty:
    strategy: heuristic
    threshold: 0.6
  within_tier: prefix_aware
  prefix_affinity_max_load_ratio: 1.5

admission:
  max_queue_depth: 256
  target_p99_ms: 2000
  shed_when_queue_full: true
  default_service_time_ms: 250
  service_time_ewma_alpha: 0.2

health:
  refresh_interval_seconds: 5

scheduling:
  priorities:
    interactive: 0
    batch: 1
  dispatch_interval_ms: 5

prefix_cache:
  ttl_seconds: 300
  max_entries: 10000
  prefix_chars: 2048

metrics:
  enabled: true
  path: /metrics
